name: Supabase keep-alive (euro_coins)

on:
  schedule:
    - cron: '0 6 */3 * *' # every 3 days at 06:00 UTC, well inside the 7-day inactivity window
  workflow_dispatch: # manual "Run workflow" button for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query countries table
        env:
          SUPABASE_URL: ${{ secrets.EURO_COINS_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EURO_COINS_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/countries?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          test "$status" = "200"

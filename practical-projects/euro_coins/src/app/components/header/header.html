<header class="app-header">
  <div class="header-content">
    <div class="header-title">
      <h1>Euro Coin Collection</h1>
      <p class="subtitle">Track your Euro coin collection</p>
    </div>
    @if (authService.isAuthenticated()) {
      <div class="header-user">
        <span class="user-email">
          {{ authService.displayName() ?? authService.currentUser()?.email }}
        </span>
        @if (authService.isAdmin()) {
          <a class="btn-header-link" routerLink="/users/new">Create user</a>
        }
        <button class="btn-logout" (click)="onLogout()">Sign Out</button>
      </div>
    }
  </div>
</header>

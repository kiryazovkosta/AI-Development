<div class="coin-card" [class.owned]="isOwned()">
  <button
    type="button"
    class="coin-image-button"
    (click)="onOpen()"
    [attr.aria-label]="'Show details for ' + altText()"
    title="Show details">
    <img
      [src]="imageUrl()"
      [alt]="altText()"
      class="coin-image"
      width="80"
      height="80"
      loading="lazy"
      (error)="onImageError($event)" />
    @if (seriesCount() > 1) {
      <span class="series-badge" [attr.aria-label]="seriesCount() + ' series'">
        {{ seriesCount() }}
      </span>
    }
    <span class="zoom-hint" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </span>
  </button>
  <label class="coin-label">
    <input
      type="checkbox"
      [checked]="isOwned()"
      (change)="onToggle()" />
    <span class="denomination-text">{{ denominationLabel() }}</span>
  </label>
</div>
